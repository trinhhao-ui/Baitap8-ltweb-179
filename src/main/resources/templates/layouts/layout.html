<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - Product Manager">Product Manager</title>

    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!--
        jQuery + Bootstrap JS + contextPath đặt trong <head> để fragment scripts
        có thể dùng $() và bootstrap.Modal(...) ngay khi DOM parse.
        defer không dùng vì fragment script cần các biến này đồng bộ.
    -->
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        var contextPath = /*[[@{/}]]*/ '';
        if (contextPath.endsWith('/')) {
            contextPath = contextPath.slice(0, -1);
        }
        /*]]>*/
    </script>
</head>

<body>

    <!-- HEADER -->
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- CONTENT (fragment inject vào đây) -->
    <main class="container mt-4" layout:fragment="content">
    </main>

    <!-- FOOTER -->
    <div th:replace="~{fragments/footer :: footer}"></div>

</body>

</html>
